<!DOCTYPE html>
<html lang="en">
<head>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0b14;font-family:'VT323',ui-monospace,monospace;color:#f6f3ee;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.card{background:rgba(13,11,20,.86);border:2px solid #45404f;box-shadow:0 0 0 2px #0d0b14}
#hud{position:fixed;left:8px;top:8px;font-size:16px;line-height:1.05;padding:5px 7px;min-width:220px;max-width:calc(100vw - 30px);pointer-events:none}
#hud h1{font-family:Silkscreen,monospace;font-size:14px;font-weight:400;margin:0 0 3px;color:#ffd98a;display:flex;justify-content:space-between;gap:12px;letter-spacing:.5px}
#hud table{border-collapse:collapse;width:100%}
#hud td{padding:0 5px 0 0;white-space:nowrap}
#hud tr.hd td{color:#9c98a2;border-bottom:1px solid #45404f}
#hud .srv td:first-child{color:#ffd98a}
#hud .foot{margin-top:3px;border-top:1px solid #45404f;padding-top:2px;color:#dcd9dc}
.dim{color:#9c98a2}.gold{color:#ffd98a}.good{color:#8fc25a}.bad{color:#ff7a3d}
#ctrl{position:fixed;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:210px}
button{font-family:'VT323',monospace;font-size:17px;line-height:1;background:#2e2a38;color:#f6f3ee;border:2px solid #5f5a68;padding:4px 7px;cursor:pointer;border-radius:0}

button.on{background:#8a2d3b;border-color:#ff7a3d}
button.go{background:#24552e;border-color:#8fc25a}
#panel{position:fixed;left:8px;right:8px;bottom:8px;max-height:47vh;display:flex;flex-direction:column}
#tabs{display:flex;gap:2px;padding:3px 3px 0}

#tabs button.sel{background:#45404f;border-color:#ffd98a;color:#ffd98a}
#tabs .tog{flex:0 0 32px}
#pbody{overflow:auto;padding:5px 8px 8px;font-size:17px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#panel.min #pbody{display:none}
.ph{margin-bottom:3px}
.ord{margin:2px 0 4px}
.otext{color:#ffd98a}
.pv{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.pv figure{margin:0;text-align:center;font-size:15px;color:#9c98a2}
.pv canvas{width:72px;height:84px;image-rendering:pixelated;border:2px solid #45404f;display:block}
.bars{flex:1;min-width:150px;font-size:16px}
.bar{display:flex;align-items:center;gap:4px;margin:1px 0}
.bar span:first-child{width:52px}
.bar .tr{flex:1;height:8px;background:#2e2a38;border:1px solid #45404f}
.bar .fl{height:100%;background:#8fc25a}
.bar b{width:62px;text-align:right;font-weight:400}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}
.row>label:first-child{width:76px;color:#ffd98a}
.seg button{padding:3px 6px;font-size:16px}
.seg button.sel{background:#45404f;border-color:#ffd98a;color:#ffd98a}
.sw{width:20px;height:20px;padding:0;border:2px solid #0d0b14;box-shadow:0 0 0 1px #45404f}
.sw.sel{border-color:#fff1c4;box-shadow:0 0 0 2px #ff7a3d}
.sw.none{background:repeating-linear-gradient(45deg,#2e2a38 0 3px,#5f5a68 3px 6px)}
input[type=range]{flex:1;min-width:110px;accent-color:#ff7a3d}
input[type=checkbox]{accent-color:#ff7a3d;width:16px;height:16px;vertical-align:-3px}
table.lad{border-collapse:collapse;width:100%;font-size:17px}
table.lad td,table.lad th{padding:2px 6px;text-align:left;font-weight:400}
table.lad th{color:#9c98a2;border-bottom:1px solid #45404f}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:Silkscreen,monospace;font-size:12px;white-space:nowrap;background:rgba(13,11,20,.85);border:2px solid #45404f;padding:2px 5px;color:#f6f3ee}
.pop.big{font-size:14px;border-color:#ffd98a;color:#ffd98a}
.tag{position:absolute;transform:translate(-50%,-100%);width:26px;height:5px;background:#2e2a38;border:1px solid #0d0b14}
.tag i{display:block;height:100%;background:#8fc25a}
#help{font-size:15px;color:#9c98a2;margin-top:4px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Silkscreen,monospace;color:#ffd98a;font-size:16px}

import * as THREE from 'three';

const S=new SB();

  if(p.x>4.3)pts=[V(4.8,0,3.4),V(2,0,3.8),V(0.2,0,6.2),V(1.5,0,8.3)];
  else if(Math.abs(p.x)<4.1&&Math.abs(p.z)<3.1)pts=[V(p.x,0,Math.min(p.z,1.9)),...ROUTE_OUT];
  else pts=[V(0.2,0,6.2),V(1.5,0,8.3)];
  if(why==='full')pts=[DOOR_OUT,V(-2,0,4.2),V(0.2,0,6.2),V(1.5,0,8.3)];
  f.walkTo(pts,()=>{c.state='gone';c.fadeOut=1;});}
function assign(st,c){freeSeat(c);c.state='toStation';st.cust=c;st.state='await';st.touched=false;const f=c.fig,seat=c.seat;
  const from=f.pos.clone();let pts=[];
  if(from.x>4.3)pts=[...TERR_TO_DOOR];else pts=[V(from.x,0,1.8)];
  pts.push(V(st.x,0,-.9),st.chair.clone());
  f.walkTo(pts,()=>{f.mode='sit';f.pos.copy(st.chair);f.yaw=Math.PI;f.seatH=.55;f.footY=.17;c.state='chair';c.tStart=simT;st.state='consult';st.plan=aiPlan(c,st.sty);st.timer=3.5;if(sel===st.i)renderPanel(true);});
  if(sel===st.i)renderPanel(true);}
function startWork(st){if(st.state!=='consult')return;const p=st.plan,ops=[];
  if(hasColour(p))ops.push({type:'colour',dur:13});
  if(p.doWave&&Math.abs(p.wave-st.cust.hair.wave)>.05)ops.push({type:'wave',dur:10});
  if(p.doCut)ops.push({type:'cut',dur:9});
  ops.push({type:'dry',dur:3.5});ops.forEach(o=>o.dur/=st.sty.spd);
  st.ops=ops;st.opi=0;st.state='work';beginOp(st);renderPanel(true);}
const TOOLS={colour:'brush',wave:'comb',cut:'scissors',dry:'dryer'};
function beginOp(st){const op=st.ops[st.opi],h=st.cust.hair,s=st.sty;op.t=0;op.from=cloneHair(h);op.acc=new Array(NS).fill(0);
  op.to=op.type==='colour'?opColour(h,st.plan,s,true):op.type==='wave'?opWave(h,st.plan,s,true):op.type==='cut'?opCut(h,st.plan,s,true):cloneHair(h);
  s.fig.setTool(TOOLS[op.type]);}
function runOps(st,dt){const op=st.ops[st.opi],c=st.cust,h=c.hair,sf=st.sty.fig;op.t+=dt;const k=clamp(op.t/op.dur),t=simT;
  if(op.type==='cut'){for(let j=0;j<NS;j++){const kk=clamp(k*1.6-(j/NS)*.6),nl=lerp(op.from.len[j],op.to.len[j],kk),rem=h.len[j]-nl;if(rem>0){op.acc[j]+=rem;h.len[j]=nl;while(op.acc[j]>1.4){op.acc[j]-=1.4;spawnClip(c.hm.endWorld(j),h.lab);}}}}
  if(op.type==='colour'){h.lab=labMix(op.from.lab,op.to.lab,smooth(k));c.tint=Math.sin(Math.PI*k)*.7;}
  if(op.type==='wave')h.wave=lerp(op.from.wave,op.to.wave,smooth(k));
  c.hm.dirty=true;
  // stylist motion (two-bone IK hands)
  c.fig.head.updateMatrixWorld(true);const hp=c.fig.head.getWorldPosition(V());const mx=Math.max(...h.len)*(1-.12*h.wave)*.011;
  let sx=0;
  if(op.type==='cut'){sx=Math.sin(t*1.3)*.18;const dy=-.05-(.5+.5*Math.sin(t*.7))*Math.min(.55,mx);const snip=Math.sin(t*22)*.012;
    sf.handR=hp.clone().add(V(sx,dy+snip,.2));sf.handL=hp.clone().add(V(sx+.09,dy+.06,.17));}
  else if(op.type==='colour'){sx=Math.sin(t*.8)*.12;sf.handR=hp.clone().add(V(sx+Math.sin(t*2.5)*.06,.1+Math.sin(t*3.1)*.05,.17));sf.handL=hp.clone().add(V(-.18,-.28,.32));}
  else if(op.type==='wave'){sf.handR=hp.clone().add(V(-.17,-.06+Math.sin(t*4)*.07,.06));sf.handL=hp.clone().add(V(.17,-.06+Math.cos(t*4)*.07,.06));}
  else{sx=Math.sin(t*1.5)*.15;sf.handR=hp.clone().add(V(sx*1.6,.14,.32));sf.handL=hp.clone().add(V(-sx*.6,.13,.14));}
  sf.pos.x=lerp(sf.pos.x,st.x+sx*.8,Math.min(1,dt*4));sf.pos.z=st.stand.z;sf.yaw=Math.PI;
  if(op.t>=op.dur){Object.assign(h,cloneHair(op.to));c.tint=0;c.hm.dirty=true;st.opi++;if(st.opi>=st.ops.length)reveal(st);else beginOp(st);if(sel===st.i)renderPanel(true);}}
const WORDS=[[.9,'Love it!'],[.75,'Looks great'],[.55,"It's fine"],[.35,'Hmm…'],[0,'Not what I asked!']];
let cash=0,served=0,ratings=[],last=null;
function reveal(st){const c=st.cust,s=st.sty,sf=s.fig;st.state='reveal';sf.setTool(null);sf.handL=sf.handR=null;
  const sc=score(c.hair,c.order);c.result=sc;const pay=Math.round(c.price*(.35+.65*sc.all)+(sc.all>.85?rand(5,20):0));
  s.stats.served++;s.stats.sum+=sc.all;s.stats.earn+=pay;ratings.push(1+4*sc.all);if(ratings.length>20)ratings.shift();served++;
  last={name:c.name,sty:s.name,all:sc.all,mins:(simT-c.tStart)/60};
  sf.walkTo([V(st.x-.55,0,-1.1)],()=>{sf.yaw=Math.PI*.8;});
  c.fig.walkTo([V(st.x+.55,0,-1.05)],()=>{c.fig.yaw=Math.PI;
    popup(`${Math.round(sc.all*100)}% · ${WORDS.find(w=>sc.all>=w[0])[1]}`,c.fig.head,'big');
    later(.6,()=>{c.fig.yaw=Math.PI*.15;clapAll(sc.all);popup(`Chair ${st.i+1}: ${Math.round(sc.all*100)}%`,recep.head,'');});
    later(2.8,()=>{st.state='free';st.cust=null;sf.walkTo([st.stand],()=>sf.yaw=Math.PI);if(sel===st.i)renderPanel(true);
      c.fig.walkTo([V(st.x+.55,0,.2),V(-2.35,0,1.0)],()=>{c.fig.yaw=-Math.PI/2;later(1.3,()=>{cash+=pay;popup('+$'+pay,c.fig.head,'big');c.state='paid';leave(c);});});});});

function clapAll(q){const n=q>.5;const who=[recep,jr.fig,...friends,...STY.map(s=>s.fig),...custs.filter(c=>c.state==='wait').map(c=>c.fig)];who.forEach(f=>{if(n||Math.random()<.3)f.clapT=rand(1.2,1.8);});}

/* junior: sweeps clippings, mops wet footprints, puts out the wet-floor sign */
function jrUpdate(dt){const f=jr.fig,T=jr.task;
  if(T){if(T.phase==='work'){T.t-=dt;f.toolAim=V(T.aim.x+Math.sin(simT*5)*.35,0,T.aim.z+Math.cos(simT*2.5)*.12);f.handR=f.pos.clone().add(V(0,1.02,0)).addScaledVector(fwd(f.yaw),.22).addScaledVector(rgt(f.yaw),.1);f.handL=f.handR.clone().add(V(0,-.22,0)).addScaledVector(fwd(f.yaw),.05);
      if(T.t<=0){T.done();jr.task=null;f.handL=f.handR=null;f.toolAim=null;f.setTool(null);}}return;}
  const go=(standAt,aim,tool,dur,done)=>{jr.task={phase:'walk',aim,done};f.handL=f.handR=null;f.walkTo([standAt],()=>{jr.task.phase='work';jr.task.t=dur;f.setTool(tool);f.yaw=Math.atan2(aim.x-f.pos.x,aim.z-f.pos.z);});};
  if(rainAmt>.5&&!wetSign.visible){go(V(-1.4,0,1.5),V(-1.4,0,2.1),'bowl',1,()=>{wetSign.visible=true;});return;}
  if(rainAmt<.1&&wetSign.visible){go(V(-1.4,0,1.5),V(-1.4,0,2.1),'bowl',1,()=>{wetSign.visible=false;});return;}
  const landed=clips.filter(c=>c.alive&&c.landed);
  if(landed.length>24){const a=landed[0].p.clone();a.y=0;const sa=a.clone().add(V(.5,0,.45));sa.x=clamp(sa.x,-3.6,3.6);sa.z=clamp(sa.z,-2.2,2.2);
    go(sa,a,'broom',3.2,()=>{clips.forEach(c=>{if(c.alive&&c.landed&&Math.hypot(c.p.x-a.x,c.p.z-a.z)<1.0)c.alive=false;});});return;}
  if(prints.length>12){const a=prints[0].p.clone();a.y=0;const sa=a.clone().add(V(.45,0,-.45));
    go(sa,a,'mop',3,()=>{for(let i=prints.length-1;i>=0;i--)if(prints[i].p.distanceTo(a)<1.3)prints[i].life=Math.min(prints[i].life,.08);});return;}
  if(!f.path.length&&f.pos.distanceTo(jr.idle)>.05){f.handL=f.handR=null;f.walkTo([jr.idle],()=>f.yaw=Math.PI);}
  if(f.pos.distanceTo(jr.idle)<.06&&!f.path.length){f.handR=V(3.5,1.0+Math.sin(simT*3)*.04,-1.32);f.handL=V(3.75,1.0+Math.cos(simT*3)*.04,-1.32);}else if(!f.path.length){f.handL=f.handR=null;}
}

/* ================= time, weather, timers ================= */
let simT=0,speed=1,autoOn=true,timeMode='auto',wxMode='auto',rainAmt=0,wet=0,rainTarget=0,wxTimer=40,spawnTimer=1.5;
const timers=[];const later=(s,fn)=>timers.push({t:s,fn});
const PRE={day:{sky:0x7ea2d0,sun:0xfff1c4,si:2.8,sp:V(6,12,5),hs:0xb6d2ec,hg:0x5f9e45,hi:1.1,inI:0,spI:0,glow:0},
  dusk:{sky:0xd88a6a,sun:0xff7a3d,si:1.9,sp:V(-11,4,4),hs:0xffb15a,hg:0x5a2440,hi:.75,inI:7,spI:22,glow:.55},
  night:{sky:0x0b1530,sun:0x7ea2d0,si:.3,sp:V(-4,10,-6),hs:0x2a4478,hg:0x0d0b14,hi:.3,inI:10,spI:38,glow:1}};
function phaseNow(){if(timeMode!=='auto')return timeMode;const d=new Date(),h=d.getHours()+d.getMinutes()/60;return(h>=7&&h<17.5)?'day':((h>=17.5&&h<19.5)||(h>=5.5&&h<7))?'dusk':'night';}
const L={sky:new THREE.Color(0x7ea2d0),sun:new THREE.Color(0xfff1c4),si:2.8,sp:V(6,12,5),hs:new THREE.Color(0xb6d2ec),hg:new THREE.Color(0x5f9e45),hi:1.1,inI:0,spI:0,glow:0};
const _ca=new THREE.Color(),_cb=new THREE.Color();
function updateLights(dt){const P=PRE[phaseNow()],k=Math.min(1,dt*1.5);
  _ca.set(P.sky).lerp(_cb.set(P===PRE.night?0x1d1a26:0x7d8a98),rainAmt*.75);L.sky.lerp(_ca,k);
  L.sun.lerp(_ca.set(P.sun),k);L.si=lerp(L.si,P.si*(1-.7*rainAmt),k);L.sp.lerp(P.sp,k);L.hs.lerp(_ca.set(P.hs).lerp(_cb.set(0x9c98a2),rainAmt*.5),k);L.hg.lerp(_ca.set(P.hg),k);
  L.hi=lerp(L.hi,P.hi*(1+.25*rainAmt),k);L.inI=lerp(L.inI,Math.max(P.inI,rainAmt*4),k);L.spI=lerp(L.spI,P.spI+(P===PRE.day?0:0),k);L.glow=lerp(L.glow,Math.max(P.glow,rainAmt*.35),k);
  scene.background.copy(L.sky);sun.color.copy(L.sun);sun.intensity=L.si;sun.position.copy(L.sp).normalize().multiplyScalar(30);hemi.color.copy(L.hs);hemi.groundColor.copy(L.hg);hemi.intensity=L.hi;
  inLights.forEach(l=>l.intensity=L.inI);spots.forEach(s=>s.intensity=L.spI);GLASS.emissiveIntensity=L.glow*.6;LAMP.emissiveIntensity=L.glow*1.2+.05;}

const pops=[];
function popup(text,obj,cls){const el=document.createElement('div');el.className='pop '+(cls||'');el.textContent=text;$('#pops').appendChild(el);pops.push({el,obj,t:0,life:2.6});}
const _p=V();
function screenOf(v){_p.copy(v).project(cam);return [(_p.x+1)/2*W*PIX,(1-_p.y)/2*H*PIX];}
function updatePops(dt){for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;const w=p.obj.getWorldPosition(V());w.y+=.35+p.t*.25;const [x,y]=screenOf(w);p.el.style.left=x+'px';p.el.style.top=y+'px';p.el.style.opacity=clamp((p.life-p.t)*2);if(p.t>p.life){p.el.remove();pops.splice(i,1);}}
  custs.forEach(c=>{if(c.state==='wait'){const w=c.fig.head.getWorldPosition(V());w.y+=.3;const [x,y]=screenOf(w);c.tag.style.display='block';c.tag.style.left=x+'px';c.tag.style.top=y+'px';const k=clamp(c.pat/c.maxPat);const i=c.tag.firstChild;i.style.width=(k*100)+'%';i.style.background=k>.5?'#8fc25a':k>.25?'#ffb15a':'#d8314a';}else c.tag.style.display='none';});}

/* ================= simulation step ================= */
function simStep(dt){simT+=dt;
  for(let i=timers.length-1;i>=0;i--){if((timers[i].t-=dt)<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
  // arrivals
  spawnTimer-=dt;if(spawnTimer<=0){spawnCustomer();const ph=phaseNow();spawnTimer=rand(11,22)*(1+.6*rainAmt)*(ph==='night'?1.4:1);}
  // weather
  if(wxMode==='auto'){wxTimer-=dt;if(wxTimer<=0){rainTarget=Math.random()<.32?1:0;wxTimer=rand(50,110);}}else rainTarget=wxMode==='rain'?1:0;
  rainAmt+=(rainTarget-rainAmt)*Math.min(1,dt*.35);wet+=((rainAmt>.3?1:0)-wet)*Math.min(1,dt*(rainAmt>.3?.12:.05));
  // waiting patience
  custs.forEach(c=>{if(c.state==='wait'){c.pat-=dt;if(c.pat<=0){popup('Too slow!',c.fig.head,'');ratings.push(1.5);if(ratings.length>20)ratings.shift();leave(c);}}});
  // stations
  stations.forEach(st=>{
    if(st.state==='free'){const c=queue.find(c=>c.state==='wait');if(c)assign(st,c);}
    else if(st.state==='consult'){if(autoOn&&!st.touched){st.timer-=dt;if(st.timer<=0)startWork(st);}}
    else if(st.state==='work')runOps(st,dt);
    if(st.state!=='work'&&st.state!=='reveal'){const sf=st.sty.fig;sf.handL=sf.handR=null;sf.setTool(st.state==='consult'?'comb':null);
      if(!sf.path.length&&sf.pos.distanceTo(st.stand)>.05)sf.walkTo([st.stand],()=>sf.yaw=Math.PI);
      if(st.state==='consult'&&st.cust){const hp=st.cust.fig.head.getWorldPosition(V());sf.handR=hp.clone().add(V(Math.sin(simT*2)*.08,.05,.22));}}});
  jrUpdate(dt);
  // receptionist watches the latest reveal / door
  const rv=stations.find(s=>s.state==='reveal');{const tgt=rv?rv.chair:DOOR_IN;const a=Math.atan2(tgt.x-recep.pos.x,tgt.z-recep.pos.z)-recep.yaw;recep.look=angLerp(recep.look,clamp(((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI,-1,1),Math.min(1,dt*3));}
  // spectators look at reveals
  custs.forEach(c=>{if(c.state==='wait'){c.fig.look=rv?angLerp(c.fig.look,.4*Math.sin(simT*.3),.02):Math.sin(simT*.4+c.id)*.3;}
    else if(c.state==='chair')c.fig.look=Math.sin(simT*.5+c.id)*.15;else c.fig.look=0;});
  // figures
  figs.forEach(f=>f.update(dt));
  custs.slice().forEach(c=>{if(c.fadeIn<1){c.fadeIn=Math.min(1,c.fadeIn+dt*2.5);setFade(c.fig,Math.max(.01,c.fadeIn));}
    if(c.fadeOut!=null){c.fadeOut-=dt*2.5;setFade(c.fig,Math.max(.01,c.fadeOut));if(c.fadeOut<=0){c.fig.remove();c.tag.remove();c.hm.mesh.dispose();custs.splice(custs.indexOf(c),1);}}
    if(c.hm.dirty||c.tint>0)c.hm.build(c.hair,FOIL,c.tint);});
  // clippings
  let n=0;for(let i=0;i<clips.length;i++){const c=clips[i];if(!c.alive){_m4.makeScale(0,0,0);clipMesh.setMatrixAt(i,_m4);continue;}
    if(!c.landed){c.v.y-=4.5*dt;c.v.multiplyScalar(1-dt*1.5);c.p.addScaledVector(c.v,dt);if(c.p.y<=.02){c.p.y=.02;c.landed=true;}}
    _m4.compose(c.p,_q.setFromAxisAngle(UP,c.ry),_s.set(.035,.02,.08));clipMesh.setMatrixAt(i,_m4);n=i+1;}
  clipMesh.count=n;clipMesh.instanceMatrix.needsUpdate=true;
  for(let i=prints.length-1;i>=0;i--){prints[i].life-=dt/40;if(prints[i].life<=0)prints.splice(i,1);}
  prints.forEach((p,i)=>{const k=clamp(p.life*3);_m4.compose(V(p.p.x,.014,p.p.z),_q.setFromAxisAngle(UP,p.yaw),_s.set(.09*k,.004,.15*k));fpMesh.setMatrixAt(i,_m4);});fpMesh.count=prints.length;fpMesh.instanceMatrix.needsUpdate=true;
}
const FOIL={L:.8,a:-.002,b:-.006};

/* ================= environment animation (real time) ================= */
function envStep(dt,t){
  const pa=rainGeo.attributes.position.array,fall=13*dt*speed;
  if(rainAmt>.03){for(let i=0;i<NR;i++){const o=i*6;pa[o+1]-=fall;pa[o+4]-=fall;if(pa[o+1]<0){const x=rand(-11,11),z=rand(-11,11),y=rand(9,13);pa[o]=x;pa[o+1]=y;pa[o+2]=z;pa[o+3]=x-.05;pa[o+4]=y+.45;pa[o+5]=z;}}rainGeo.attributes.position.needsUpdate=true;}
  rain.visible=rainAmt>.03;rainGeo.setDrawRange(0,Math.floor(NR*clamp(rainAmt))*2);
  puddles.visible=wet>.03;puddles.children.forEach(m=>m.scale.setScalar(Math.max(.01,wet)));puddleMat.uniforms.time.value=t;puddleMat.uniforms.wet.value=wet;
  const fp=flagGeo.attributes.position.array,ws=1+rainAmt;for(let i=0;i<fp.length;i+=3){const x=flagBase[i];fp[i+2]=Math.sin(x*4-t*5*ws)*.09*x;fp[i+1]=flagBase[i+1]-x*x*.05*rainAmt;}flagGeo.attributes.position.needsUpdate=true;flagGeo.computeVertexNormals();
  poleTex.offset.y=(t*.4)%1;
  awning.scale.z=1+.5*rainAmt;
  clouds.forEach((g,i)=>{g.position.x+=dt*.25*speed*(1+i*.1);if(g.position.x>15)g.position.x=-15;});
  rocks.forEach(g=>g.position.y=g.userData.y+Math.sin(t*.6+g.userData.p)*.15);
  const shade=_ca.set(0xf6f3ee).lerp(_cb.set(0x5f5a68),rainAmt*.8);  clouds.forEach(g=>{const a=g.userData.m.geometry.attributes.color;for(let i=0;i<a.count;i++)a.setXYZ(i,shade.r,shade.g,shade.b);a.needsUpdate=true;});
  // cutaway walls facing the camera
  const v=V(Math.sin(camAz),0,Math.cos(camAz));walls.forEach(w=>{const front=w.n.dot(v)>.2;w.full.visible=!front;w.low.visible=front;});
  // selection marker
  if(typeof sel==='number'){const st=stations[sel];marker.visible=true;marker.position.set(st.x,2.35+Math.abs(Math.sin(t*3))*.15,-1.8);}else marker.visible=false;
}

let sel=0;const tabs=$('#tabs'),pbody=$('#pbody');let panelKey='';
function stLabel(st){if(!st.cust)return'<span class="dim">Free</span>';if(st.state==='await')return'Walking in';
  if(st.state==='consult')return autoOn&&!st.touched?`Consult · auto in ${Math.max(0,st.timer).toFixed(0)}s`:'<span class="gold">Waiting for your plan</span>';
  if(st.state==='work'){const o=st.ops[st.opi];return `${({colour:'Colouring',wave:'Perming',cut:'Cutting',dry:'Blow-dry'})[o.type]} ${Math.round(clamp(o.t/o.dur)*100)}%`;}return'Reveal';}
function renderTabs(){tabs.innerHTML=stations.map(st=>`<button data-t="${st.i}" class="${sel===st.i?'sel':''}">${st.i+1}·${st.sty.name}</button>`).join('')+`<button data-t="L" class="${sel==='L'?'sel':''}">Ladder</button><button class="tog" id="bMin">${$('#panel').classList.contains('min')?'▴':'▾'}</button>`;
  tabs.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=b.dataset.t==='L'?'L':+b.dataset.t;$('#panel').classList.remove('min');renderPanel(true);});
  $('#bMin').onclick=()=>{$('#panel').classList.toggle('min');renderTabs();};}
function swatches(k,cur){return `<button class="sw none ${cur<0?'sel':''}" data-${k}="-1" title="None"></button>`+DYES.map((d,i)=>`<button class="sw ${cur===i?'sel':''}" data-${k}="${i}" title="${d.n}" style="background:${hexCss(d.h)}"></button>`).join('');}
function seg(k,list,cur){return `<span class="seg">${list.map((n,i)=>`<button data-${k}="${typeof cur==='string'?n:i}" class="${(typeof cur==='string'?n===cur:i===cur)?'sel':''}">${n}</button>`).join('')}</span>`;}
function renderPanel(force){
  const key=sel==='L'?'L'+served:(()=>{const st=stations[sel];return [sel,st.state,st.cust&&st.cust.id,st.opi].join('|');})();
  if(!force&&key===panelKey){refreshDynamic();return;}panelKey=key;renderTabs();
  if(sel==='L'){const rows=STY.slice().sort((a,b)=>(b.stats.served?b.stats.sum/b.stats.served:0)-(a.stats.served?a.stats.sum/a.stats.served:0));
    pbody.innerHTML=`<table class="lad"><tr><th>#</th><th>Stylist</th><th>Style</th><th>Done</th><th>Avg match</th><th>Takings</th></tr>${rows.map((s,i)=>`<tr><td>${i===0&&s.stats.served?'♛':i+1}</td><td style="color:${hexCss(s.apron)}">${s.name}</td><td class="dim">${s.style}</td><td>${s.stats.served}</td><td>${s.stats.served?Math.round(s.stats.sum/s.stats.served*100)+'%':'–'}</td><td>$${s.stats.earn}</td></tr>`).join('')}</table>
    <div id="help">Mia cuts precisely but slowly. Jun is fast, a little rough and cuts short. Rosa is a colourist who mixes tubes finely. The ladder is ranked by average match.</div>`;return;}
  const st=stations[sel],c=st.cust;
  let h=`<div class="ph"><b>Chair ${st.i+1}</b> · <span style="color:${hexCss(st.sty.apron)}">${st.sty.name}</span> <span class="dim">(${st.sty.style})</span> · <span id="stl">${stLabel(st)}</span></div>`;
  if(!c){pbody.innerHTML=h+`<div class="dim">Free. Next from the queue: ${queue.length?queue.map(q=>q.name).join(', '):'nobody yet'}.</div><div id="help">Tap a chair or a client in the salon to open their station. With Auto on, stylists plan and start by themselves. Open a chair during the consult to take over.</div>`;return;}
  h+=`<div class="ord"><b>${c.name}</b> wants <span class="otext">${orderText(c.order)}</span> <span class="dim">· $${c.price}</span></div>`;
  h+=`<div class="pv"><figure><canvas id="pvO" width="48" height="56"></canvas><figcaption>Order</figcaption></figure><figure><canvas id="pvN" width="48" height="56"></canvas><figcaption>Now</figcaption></figure>${st.state==='consult'?`<figure><canvas id="pvP" width="48" height="56"></canvas><figcaption>Plan</figcaption></figure>`:''}<div class="bars" id="bars"></div></div>`;
  if(st.state==='consult'){const p=st.plan;
    h+=`<div class="row"><label><input type="checkbox" data-k="doCut" ${p.doCut?'checked':''}> Cut</label>${seg('shape',SHAPES,p.shape)}</div>
    <div class="row"><label class="dim">length</label><input type="range" min="1" max="60" step="0.5" value="${p.L}" data-r="L"><span id="Lv"></span></div>
    <div class="row"><label><input type="checkbox" data-k="doColour" ${p.doColour?'checked':''}> Colour</label><span class="dim">bleach</span>${seg('bl',['0','1','2','3'],p.bleach)}</div>
    <div class="row"><label class="dim">tube A</label>${swatches('a',p.dyeA)}</div>
    <div class="row"><label class="dim">tube B</label>${swatches('b',p.dyeB)}</div>
    <div class="row"><label class="dim">mix A↔B</label><input type="range" min="0.05" max="0.95" step="0.05" value="${p.mix}" data-r="mix"><span id="Mv"></span></div>
    <div class="row"><label><input type="checkbox" data-k="doWave" ${p.doWave?'checked':''}> Wave</label>${seg('wv',WAVES,p.wave)}</div>
    <div class="row"><button id="bPlan">Auto plan</button><button id="bStart" class="go">Start ▶</button><span class="dim" id="dyeN"></span></div>`;}
  if(st.state==='work')h+=`<div id="ops" class="dim"></div>`;
  pbody.innerHTML=h;
  if(st.state==='consult'){const p=st.plan,touch=()=>{st.touched=true;};
    pbody.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{p[e.dataset.k]=e.checked;touch();refreshDynamic();});
    pbody.querySelectorAll('[data-r]').forEach(e=>e.oninput=()=>{p[e.dataset.r]=+e.value;touch();refreshDynamic();});
    pbody.querySelectorAll('[data-shape]').forEach(e=>e.onclick=()=>{p.shape=e.dataset.shape;p.doCut=true;touch();renderPanel(true);});
    pbody.querySelectorAll('[data-bl]').forEach(e=>e.onclick=()=>{p.bleach=+e.dataset.bl;p.doColour=true;touch();renderPanel(true);});
    pbody.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{p.dyeA=+e.dataset.a;p.doColour=true;touch();renderPanel(true);});
    pbody.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{p.dyeB=+e.dataset.b;p.doColour=true;touch();renderPanel(true);});
    pbody.querySelectorAll('[data-wv]').forEach(e=>e.onclick=()=>{p.wave=+e.dataset.wv;p.doWave=true;touch();renderPanel(true);});
    $('#bPlan').onclick=()=>{st.plan=aiPlan(c,st.sty);touch();renderPanel(true);};
    $('#bStart').onclick=()=>startWork(st);}
  refreshDynamic();}
function bars(sc,label){return `<div class="dim" style="font-size:15px">${label}</div>`+[['Cut',sc.cut,`±${sc.mad.toFixed(1)}cm`],['Colour',sc.col,`ΔE ${sc.dE.toFixed(0)}`],['Wave',sc.wav,''],['Match',sc.all,'']].map(([n,v,x])=>`<div class="bar"><span>${n}</span><div class="tr"><div class="fl" style="width:${Math.round(v*100)}%;background:${v>.75?'#8fc25a':v>.5?'#ffb15a':'#d8314a'}"></div></div><b>${Math.round(v*100)}% <span class="dim">${x}</span></b></div>`).join('')+(sc.dmg>0?`<div class="bad" style="font-size:15px">Damage −${Math.round(sc.dmg*100)}%</div>`:'');}
function refreshDynamic(){if(sel==='L')return;const st=stations[sel],c=st.cust;const e=$('#stl');if(e)e.innerHTML=stLabel(st);if(!c)return;
  const skin=hexCss(c.fig.o.skin);const o={len:profile(c.order.shape,c.order.L).map(v=>v/(1-.12*c.order.wave)),lab:c.order.lab,wave:c.order.wave};
  drawPV($('#pvO'),o,skin);drawPV($('#pvN'),c.hair,skin,c.tint);
  if(st.state==='consult'){const p=st.plan,pr=applyPlan(c.hair,p,st.sty,false);drawPV($('#pvP'),pr,skin);$('#bars').innerHTML=bars(score(pr,c.order),'Predicted (before hand error)');
    const wv=p.doWave?p.wave:c.hair.wave;$('#Lv').textContent=`cut ${p.L} cm → looks ~${(p.L*(1-.12*wv)).toFixed(1)} cm`;
    const dl=dyeLab(p.dyeA,p.dyeB,p.mix);$('#Mv').textContent=p.dyeA>=0&&p.dyeB>=0?`${Math.round((1-p.mix)*100)}:${Math.round(p.mix*100)}`:'one tube';
    $('#dyeN').innerHTML=p.doColour?` result <span style="display:inline-block;width:14px;height:12px;vertical-align:-2px;background:${labCss(pr.lab)}"></span>${dl?'':' (bleach only)'}`:'';}
  else{$('#bars').innerHTML=bars(score(c.hair,c.order),st.state==='reveal'||c.result?'Result':'Live match');}
  const ops=$('#ops');if(ops&&st.ops.length)ops.innerHTML=st.ops.map((o,i)=>`<span class="${i===st.opi?'gold':i<st.opi?'good':''}">${i<st.opi?'✓ ':''}${o.type}</span>`).join(' → ');}
function drawPV(cv,h,skin,tint=0){if(!cv)return;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#1d1a26';g.fillRect(0,0,48,56);
  const lab=tint>0?labMix(h.lab,FOIL,tint):h.lab;
  g.fillStyle='#5f5a68';g.fillRect(7,41,34,15);g.fillStyle=skin;g.fillRect(20,32,8,10);g.fillRect(15,10,18,22);
  const w=h.wave,side=(h.len[7]+h.len[8]+h.len[9]+h.len[10])/4,capW=side<4?14:20;
  g.fillStyle=labCss(lab,.93);g.fillRect(24-capW/2,7,capW,13);g.fillRect(24-capW/2+1,6,capW-2,1);
  const order=[11,12,7,8,9,10,5,6,0,1,2,3,4];
  order.forEach(j=>{const s=STR[j],x0=Math.round(24-s.p.x*75*(s.p.z>.05?1.2:1)),y0=s.z===3?12:s.z===2?13:16,vis=h.len[j]*(1-.12*w),Lp=Math.round(vis*.62);
    g.fillStyle=labCss(lab,s.z===0?1:.86);for(let y=0;y<Lp;y++){const off=Math.round(Math.sin(y*(.35+.12*w)+j)*w*1.1);g.fillRect(x0-1+off,y0+y,3,1);}});}
function updateHud(){const d=new Date();const avg=ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:0;
  const stage=st=>!st.cust?'<span class="dim">free</span>':st.state==='work'?({colour:'colour',wave:'perm',cut:'cut',dry:'dry'})[st.ops[st.opi].type]:st.state==='consult'?'consult':st.state==='await'?'seating':'reveal';
  const m=st=>st.cust?Math.round(score(st.cust.hair,st.cust.order).all*100)+'%':'';
  $('#hud').innerHTML=`<h1><span>CUT &amp; DRIED</span><span>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span></h1>
  <table><tr class="hd"><td></td><td>Stylist</td><td>Client</td><td>Stage</td><td>Match</td></tr>${stations.map(st=>`<tr class="${st.state==='work'?'srv':''}"><td>${st.state==='work'?'✂':st.i+1}</td><td>${st.sty.name}</td><td>${st.cust?st.cust.name:'—'}</td><td>${stage(st)}</td><td>${m(st)}</td></tr>`).join('')}</table>
  <div class="foot">$${cash} · ★${avg?avg.toFixed(1):'–'} · served ${served} · queue ${queue.length}${rainAmt>.5?' · ☂':''}</div>
  ${last?`<div class="dim">Last: ${last.name} ${Math.round(last.all*100)}% by ${last.sty} in ${last.mins.toFixed(1)} min</div>`:''}`;}

/* controls */
$('#bRotL').onclick=()=>camK--;$('#bRotR').onclick=()=>camK++;
addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q')camK--;if(e.key==='e'||e.key==='E')camK++;});
const TM=['auto','day','dusk','night'],TL={auto:'☀ Auto',day:'☀ Day',dusk:'☀ Dusk',night:'☾ Night'};
$('#bTime').onclick=()=>{timeMode=TM[(TM.indexOf(timeMode)+1)%4];$('#bTime').textContent=TL[timeMode];};
const WM=['auto','clear','rain'],WL={auto:'☁ Auto',clear:'☀ Clear',rain:'☂ Rain'};
$('#bWx').onclick=()=>{wxMode=WM[(WM.indexOf(wxMode)+1)%3];$('#bWx').textContent=WL[wxMode];};
$('#bSpd').onclick=()=>{speed=speed===1?3:1;$('#bSpd').textContent='×'+speed;$('#bSpd').classList.toggle('on',speed===3);};
$('#bAuto').onclick=()=>{autoOn=!autoOn;$('#bAuto').classList.toggle('on',autoOn);renderPanel(true);};
$('#bZo').onclick=()=>zoom=clamp(zoom/1.2,.6,2.2);$('#bZi').onclick=()=>zoom=clamp(zoom*1.2,.6,2.2);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.1:1/1.1),.6,2.2);},{passive:false});
const ptrs=new Map();let pinch0=0,zoom0=1,down=null;
canvas.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1)down=[e.clientX,e.clientY];if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);zoom0=zoom;down=null;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];zoom=clamp(zoom0*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch0,.6,2.2);}});
const endP=e=>{if(down&&ptrs.size===1&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<10)pickAt(e.clientX,e.clientY);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(!ptrs.size)down=null;};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);down=null;});
const ray=new THREE.Raycaster();
function pickAt(x,y){const r=canvas.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1),cam);
  const hits=ray.intersectObjects(world.children,true).filter(h=>h.object.visible&&h.object.parent.visible);if(!hits.length)return;
  const h=hits[0],f=h.object.userData.fig;
  if(f){const st=stations.find(s=>s.sty.fig===f||(s.cust&&s.cust.fig===f));if(st){sel=st.i;$('#panel').classList.remove('min');renderPanel(true);return;}
    const c=custs.find(c=>c.fig===f);if(c){popup(`${c.name}: ${orderText(c.order)}`,c.fig.head,'');return;}}
  const p=h.point;let best=null,bd=.9;stations.forEach(s=>{const d=Math.hypot(p.x-s.x,p.z-s.chair.z);if(d<bd){bd=d;best=s;}});
  if(best){sel=best.i;$('#panel').classList.remove('min');renderPanel(true);}}

/* ================= main loop ================= */
const clipPlane=new THREE.Plane(V(0,-1,0),-0.03);
resize();addEventListener('resize',resize);
renderPanel(true);updateHud();
later(.5,spawnCustomer);later(4,spawnCustomer);later(8,spawnCustomer);
$('#load').remove();
let lastT=performance.now(),hudT=0,clockT=0,realT=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-lastT)/1000);lastT=now;realT+=dt;
  simStep(dt*speed);updateLights(dt);updateCam(dt);envStep(dt,realT);updatePops(dt);
  if((hudT+=dt)>.25){hudT=0;updateHud();renderPanel(false);}
  if((clockT+=dt)>1){clockT=0;drawClock();}
  if(wet>.03){world.scale.y=-1;puddles.visible=false;const rv=rain.visible;rain.visible=false;renderer.clippingPlanes=[clipPlane];
    renderer.setRenderTarget(refRT);renderer.render(scene,cam);world.scale.y=1;renderer.clippingPlanes=[];puddles.visible=true;rain.visible=rv;}
  renderer.setRenderTarget(rt);renderer.render(scene,cam);
  renderer.setRenderTarget(null);renderer.render(post,postCam);}
requestAnimationFrame(frame);
</script>
