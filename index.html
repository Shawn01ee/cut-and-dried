.card{background:#15121d;border:2px solid #5f5a68;box-shadow:0 0 0 2px #0d0b14,inset 0 0 0 1px #2a2535,0 4px 0 2px rgba(13,11,20,.5)}

#tabs{gap:3px;padding:4px 4px 0;background:#100d17;border-bottom:2px solid #5f5a68}

.bsec{background:#1b1724;border:1px solid #2e2a38;padding:6px 8px 7px;margin:0 0 6px;box-shadow:inset 0 1px 0 #26202f}

.pop{border-color:#5f5a68;box-shadow:0 2px 0 #0d0b14}

.tag{box-shadow:0 1px 0 #0d0b14}
.scard{padding:5px 0 8px;border-bottom:1px solid #2e2a38}

.sk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 8px;margin:3px 0 5px}
.sk div{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:4px}
.sk span{color:#9c98a2}.sk b{font-weight:400;text-align:right;color:#f6f3ee}
.sk i{grid-column:1/-1;display:block;height:3px;margin-top:1px;background:#2e2a38;position:relative}
.sk i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--v);background:#7fb6f0}

.kv dt{color:#9c98a2;white-space:nowrap}.kv dd{margin:0;color:#dcd9dc}
.gtip{position:absolute;display:none;transform:translate(16px,-50%);font-size:13px;white-space:nowrap;background:rgba(36,30,47,.95);border:2px solid #ff7a3d;color:#ffd0b5;padding:2px 6px;box-shadow:0 2px 0 #0d0b14}
.own{height:8px;background:#8fd0ff;border:1px solid #0d0b14;margin:2px 0 4px}
.own i{display:block;height:100%;background:#ff9fc4}
.meter{height:5px;background:#2e2a38;margin:2px 0 4px}.meter i{display:block;height:100%;background:#8fc25a}.meter.gold i{background:#ffd98a}
.offer{border:1px solid #2e2a38;background:#15121d;padding:4px 6px;margin:4px 0}
@keyframes cardIn{0%{opacity:0;translate:0 10px}100%{opacity:1;translate:0 0}}
@keyframes fadeUp{0%{opacity:0;translate:0 4px}100%{opacity:1;translate:0 0}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes popIn{0%{opacity:0;scale:.5}60%{opacity:1;scale:1.12}100%{opacity:1;scale:1}}
@keyframes blink{50%{filter:brightness(1.6)}}
#menu:not(.hide){animation:fadeIn .18s steps(3) both}

#incident.show{animation:cardIn .2s steps(3) both}

.bar .fl{transition:width .3s steps(5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
